name: Idea or question
description: Suggest another way to mess the picture up, ask a question or describe an awkward moment. A reference helps.
body:
  - type: markdown
    attributes:
      value: "This is a public conversation. Please keep private information out of it. For private support, email bogdan.kirilenko+gleitzsch@proton.me."
  - type: textarea
    id: idea
    attributes:
      label: What’s on your mind?
      description: Another way to mess the picture up, or something awkward about the camera. A reference — a still, a clip or a link — helps. Don’t attach private photographs.
    validations:
      required: true
